<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkSnap — URL Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
          --bg1: #0f0f1a;
          --bg2: #1a1a2e;
          --bg3: #16213e;
          --glass: rgba(255, 255, 255, 0.05);
          --glass-border: rgba(255, 255, 255, 0.1);
          --text1: #ffffff;
          --text2: #a8b2d8;
          --text3: #64748b;
          --accent: #7c3aed;
          --accent2: #06b6d4;
          --accent-glow: rgba(124, 58, 237, 0.3);
          --success: #10b981;
          --danger: #ef4444;
          --input-bg: rgba(255, 255, 255, 0.07);
        }

        [data-theme="light"] {
          --bg1: #f0f4ff;
          --bg2: #e8eeff;
          --bg3: #dde5ff;
          --glass: rgba(255, 255, 255, 0.6);
          --glass-border: rgba(255, 255, 255, 0.8);
          --text1: #1e1b4b;
          --text2: #4338ca;
          --text3: #6366f1;
          --accent: #7c3aed;
          --accent2: #0891b2;
          --accent-glow: rgba(124, 58, 237, 0.15);
          --input-bg: rgba(255, 255, 255, 0.7);
        }

        body {
          font-family: 'Inter', system-ui, sans-serif;
          background: var(--bg1);
          color: var(--text1);
          min-height: 100vh;
          transition: all 0.3s;
        }

        .bg-orbs {
          position: fixed;
          inset: 0;
          overflow: hidden;
          z-index: 0;
          pointer-events: none;
        }

        .orb {
          position: absolute;
          border-radius: 50%;
          filter: blur(80px);
          opacity: 0.15;
          animation: float 8s ease-in-out infinite;
        }

        .orb1 { width: 500px; height: 500px; background: #7c3aed; top: -150px; left: -150px; animation-delay: 0s; }
        .orb2 { width: 400px; height: 400px; background: #06b6d4; bottom: -100px; right: -100px; animation-delay: 2s; }
        .orb3 { width: 300px; height: 300px; background: #ec4899; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 4s; }

        [data-theme="light"] .orb { opacity: 0.08; }

        @keyframes float {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-20px); }
        }

        .orb3 {
          animation: floatCenter 8s ease-in-out infinite;
          animation-delay: 4s;
        }

        @keyframes floatCenter {
          0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
          50% { transform: translate(-50%, -50%) translateY(-20px); }
        }

        .container {
          position: relative;
          z-index: 1;
          max-width: 700px;
          margin: 0 auto;
          padding: 20px 16px 60px;
        }

        nav {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 16px 0 40px;
        }

        .logo {
          font-size: 22px;
          font-weight: 700;
          background: linear-gradient(135deg, #7c3aed, #06b6d4);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        .theme-btn {
          background: var(--glass);
          border: 1px solid var(--glass-border);
          color: var(--text1);
          padding: 8px 20px;
          border-radius: 20px;
          cursor: pointer;
          font-size: 13px;
          font-weight: 500;
          transition: all 0.2s;
          backdrop-filter: blur(10px);
          font-family: inherit;
        }

        .theme-btn:hover {
          background: var(--accent);
          border-color: var(--accent);
          color: #fff;
        }

        .hero {
          text-align: center;
          margin-bottom: 40px;
        }

        .hero h1 {
          font-size: 42px;
          font-weight: 700;
          line-height: 1.2;
          margin-bottom: 14px;
        }

        .hero h1 span {
          background: linear-gradient(135deg, #7c3aed, #06b6d4);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        .hero p {
          color: var(--text2);
          font-size: 17px;
        }

        .glass-card {
          background: var(--glass);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid var(--glass-border);
          border-radius: 24px;
          padding: 32px;
          margin-bottom: 20px;
          transition: all 0.3s;
        }

        .input-group { margin-bottom: 18px; }

        label {
          display: block;
          font-size: 13px;
          font-weight: 500;
          color: var(--text2);
          margin-bottom: 7px;
          letter-spacing: 0.3px;
        }

        input {
          width: 100%;
          padding: 13px 16px;
          background: var(--input-bg);
          border: 1px solid var(--glass-border);
          border-radius: 12px;
          color: var(--text1);
          font-size: 14px;
          font-family: inherit;
          outline: none;
          transition: all 0.2s;
        }

        input:focus {
          border-color: var(--accent);
          box-shadow: 0 0 0 3px var(--accent-glow);
        }

        input::placeholder { color: var(--text3); }

        .row {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 14px;
        }

        @media (max-width: 500px) { .row { grid-template-columns: 1fr; } }

        .btn {
          width: 100%;
          padding: 15px;
          background: linear-gradient(135deg, #7c3aed, #06b6d4);
          border: none;
          border-radius: 12px;
          color: #fff;
          font-size: 15px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.2s;
          margin-top: 8px;
          font-family: inherit;
          letter-spacing: 0.3px;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .result-card { display: none; }
        .result-card.show { display: block; }

        .result-label {
          font-size: 13px;
          font-weight: 500;
          color: var(--text2);
          margin-bottom: 14px;
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .result-label::before {
          content: '';
          display: inline-block;
          width: 8px;
          height: 8px;
          background: var(--success);
          border-radius: 50%;
          animation: pulse 2s infinite;
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.4; }
        }

        .short-url-box {
          background: var(--input-bg);
          border: 1px solid var(--glass-border);
          border-radius: 12px;
          padding: 16px 20px;
          margin-bottom: 16px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
        }

        .short-url {
          color: var(--accent2);
          font-weight: 600;
          font-size: 15px;
          word-break: break-all;
          text-decoration: none;
        }

        .short-url:hover { text-decoration: underline; }

        .copy-btn {
          padding: 8px 18px;
          background: var(--accent);
          border: none;
          border-radius: 8px;
          color: #fff;
          font-size: 13px;
          font-weight: 500;
          cursor: pointer;
          white-space: nowrap;
          font-family: inherit;
          transition: all 0.2s;
          flex-shrink: 0;
        }

        .copy-btn:hover { opacity: 0.85; }

        .actions {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }

        .action-btn {
          padding: 11px;
          border-radius: 10px;
          font-size: 13px;
          font-weight: 500;
          cursor: pointer;
          font-family: inherit;
          transition: all 0.2s;
          border: 1px solid var(--glass-border);
        }

        .stats-btn {
          background: var(--glass);
          color: var(--text1);
        }

        .stats-btn:hover {
          background: var(--accent);
          border-color: var(--accent);
          color: #fff;
        }

        .delete-btn {
          background: rgba(239, 68, 68, 0.1);
          color: #ef4444;
          border-color: rgba(239, 68, 68, 0.2);
        }

        .delete-btn:hover { background: #ef4444; color: #fff; border-color: #ef4444; }

        .divider {
          height: 1px;
          background: var(--glass-border);
          margin: 20px 0;
        }

        .stats-box {
          margin-top: 16px;
          display: none;
          animation: fadeIn 0.3s ease;
        }

        .stats-box.show { display: block; }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(-8px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .stats-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 12px;
          margin-top: 12px;
        }

        .stat {
          text-align: center;
          padding: 16px 12px;
          background: var(--glass);
          border-radius: 12px;
          border: 1px solid var(--glass-border);
        }

        .stat-num {
          font-size: 28px;
          font-weight: 700;
          background: linear-gradient(135deg, #7c3aed, #06b6d4);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        .stat-label {
          font-size: 11px;
          color: var(--text2);
          margin-top: 4px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }

        .error-box {
          background: rgba(239, 68, 68, 0.1);
          border: 1px solid rgba(239, 68, 68, 0.3);
          border-radius: 12px;
          padding: 12px 16px;
          color: #ef4444;
          font-size: 13px;
          margin-top: 12px;
          display: none;
          animation: fadeIn 0.3s ease;
        }

        .error-box.show { display: block; }

        .success-msg {
          background: rgba(16, 185, 129, 0.1);
          border: 1px solid rgba(16, 185, 129, 0.3);
          border-radius: 12px;
          padding: 12px 16px;
          color: #10b981;
          font-size: 13px;
          margin-top: 12px;
          display: none;
          animation: fadeIn 0.3s ease;
        }

        .success-msg.show { display: block; }

        footer {
          text-align: center;
          color: var(--text3);
          font-size: 13px;
          margin-top: 40px;
        }

        footer a {
          color: var(--accent2);
          text-decoration: none;
        }

        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
</div>

<div class="container">

    <nav>
        <div class="logo">LinkSnap</div>
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀ Light Mode</button>
    </nav>

    <div class="hero">
        <h1>Shorten any URL<br><span>instantly & beautifully</span></h1>
        <p>Paste your long link and get a clean short URL in seconds</p>
    </div>

    <!-- Main Card -->
    <div class="glass-card">
        <div class="input-group">
            <label>Long URL *</label>
            <input type="url" id="originalUrl" placeholder="https://your-very-long-url.com/goes/here" />
        </div>
        <div class="row">
            <div class="input-group">
                <label>Custom Code (optional)</label>
                <input type="text" id="customUrl" placeholder="e.g. my-link" />
            </div>
            <div class="input-group">
                <label>Expiry Date (optional)</label>
                <input type="datetime-local" id="expiresAt" />
            </div>
        </div>
        <button class="btn" onclick="shortenUrl()" id="shortenBtn">Shorten URL</button>
        <div class="error-box" id="errorBox"></div>
    </div>

    <!-- Result Card -->
    <div class="glass-card result-card" id="resultCard">
        <div class="result-label">Your short URL is ready</div>
        <div class="short-url-box">
            <a class="short-url" id="shortUrlText" href="#" target="_blank"></a>
            <button class="copy-btn" onclick="copyUrl()" id="copyBtn">Copy</button>
        </div>
        <div class="actions">
            <button class="action-btn stats-btn" onclick="toggleStats()" id="statsToggleBtn">View Stats</button>
            <button class="action-btn delete-btn" onclick="deleteUrl()">Delete URL</button>
        </div>
        <div class="stats-box" id="statsBox">
            <div class="divider"></div>
            <label>Link Analytics</label>
            <div class="stats-grid">
                <div class="stat">
                    <div class="stat-num" id="clickCount">0</div>
                    <div class="stat-label">Total Clicks</div>
                </div>
                <div class="stat">
                    <div class="stat-num" id="createdAt">—</div>
                    <div class="stat-label">Created On</div>
                </div>
            </div>
        </div>
        <div class="success-msg" id="successMsg"></div>
    </div>

    <footer>
        Built with Spring Boot &amp; MySQL &nbsp;·&nbsp;
        <a href="https://github.com/Prathamesh-495/url-shortener" target="_blank">View on GitHub</a>
    </footer>

</div>

<script>
    let currentShortCode = '';
    let statsVisible = false;

    function toggleTheme() {
      const html = document.documentElement;
      const btn = document.getElementById('themeBtn');
      if (html.getAttribute('data-theme') === 'dark') {
        html.setAttribute('data-theme', 'light');
        btn.textContent = '☾ Dark Mode';
      } else {
        html.setAttribute('data-theme', 'dark');
        btn.textContent = '☀ Light Mode';
      }
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.classList.add('show');
      setTimeout(() => box.classList.remove('show'), 4000);
    }

    function showSuccess(msg) {
      const box = document.getElementById('successMsg');
      box.textContent = msg;
      box.classList.add('show');
      setTimeout(() => box.classList.remove('show'), 3000);
    }

    async function shortenUrl() {
      const url = document.getElementById('originalUrl').value.trim();
      const custom = document.getElementById('customUrl').value.trim();
      const expires = document.getElementById('expiresAt').value;
      const btn = document.getElementById('shortenBtn');

      if (!url) { showError('Please enter a URL!'); return; }

      btn.textContent = 'Shortening...';
      btn.disabled = true;

      const body = { originalUrl: url };
      if (custom) body.customUrl = custom;
      if (expires) body.expiresAt = expires;

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const err = await res.text();
          showError(err || 'Something went wrong!');
          return;
        }

        const data = await res.json();
        currentShortCode = data.shortCode;

        const shortUrlEl = document.getElementById('shortUrlText');
        shortUrlEl.textContent = data.shortUrl;
        shortUrlEl.href = data.shortUrl;

        document.getElementById('resultCard').classList.add('show');
        document.getElementById('statsBox').classList.remove('show');
        document.getElementById('statsToggleBtn').textContent = 'View Stats';
        statsVisible = false;

        document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      } catch (e) {
        showError('Failed to connect to server!');
      } finally {
        btn.textContent = 'Shorten URL';
        btn.disabled = false;
      }
    }

    function copyUrl() {
      const url = document.getElementById('shortUrlText').textContent;
      navigator.clipboard.writeText(url);
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 2000);
    }

    async function toggleStats() {
      const btn = document.getElementById('statsToggleBtn');
      if (statsVisible) {
        document.getElementById('statsBox').classList.remove('show');
        btn.textContent = 'View Stats';
        statsVisible = false;
        return;
      }
      try {
        const res = await fetch(`/api/urls/${currentShortCode}/stats`);
        if (!res.ok) { showError('Could not fetch stats'); return; }
        const data = await res.json();
        document.getElementById('clickCount').textContent = data.clickCount;
        document.getElementById('createdAt').textContent = new Date(data.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('statsBox').classList.add('show');
        btn.textContent = 'Hide Stats';
        statsVisible = true;
      } catch (e) {
        showError('Failed to fetch stats!');
      }
    }

    async function deleteUrl() {
      if (!confirm('Are you sure you want to delete this short URL?')) return;
      try {
        const res = await fetch(`/api/urls/${currentShortCode}`, { method: 'DELETE' });
        if (res.ok) {
          document.getElementById('resultCard').classList.remove('show');
          document.getElementById('originalUrl').value = '';
          document.getElementById('customUrl').value = '';
          document.getElementById('expiresAt').value = '';
          currentShortCode = '';
          statsVisible = false;
        } else {
          showError('Failed to delete URL');
        }
      } catch (e) {
        showError('Failed to connect!');
      }
    }
</script>

</body>
</html>
