<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 550px;
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }

        p.subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #5a6fd6;
        }

        .result {
            display: none;
            margin-top: 24px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 8px;
            border: 2px solid #667eea;
        }

        .result p {
            color: #555;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .result a {
            color: #667eea;
            font-weight: 600;
            font-size: 16px;
            word-break: break-all;
            text-decoration: none;
        }

        .result a:hover {
            text-decoration: underline;
        }

        .copy-btn {
            margin-top: 12px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            width: auto;
        }

        .error {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            background: #fff5f5;
            border: 2px solid #fc8181;
            border-radius: 8px;
            color: #e53e3e;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔗 URL Shortener</h1>
        <p class="subtitle">Shorten your long URLs instantly</p>

        <label>Long URL *</label>
        <input type="url" id="originalUrl" placeholder="https://www.example.com" />

        <label>Custom Code (optional)</label>
        <input type="text" id="customUrl" placeholder="e.g. my-link" />

        <label>Expiry Date (optional)</label>
        <input type="datetime-local" id="expiresAt" />

        <button onclick="shortenUrl()">Shorten URL</button>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <p>Your short URL:</p>
            <a id="shortUrl" href="#" target="_blank"></a>
            <br>
            <button class="copy-btn" onclick="copyUrl()">Copy URL</button>
        </div>
    </div>

    <script>
        async function shortenUrl() {
            const originalUrl = document.getElementById('originalUrl').value;
            const customUrl = document.getElementById('customUrl').value;
            const expiresAt = document.getElementById('expiresAt').value;

            // hide previous results
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';

            if (!originalUrl) {
                showError('Please enter a URL!');
                return;
            }

            const body = { originalUrl };
            if (customUrl) body.customUrl = customUrl;
            if (expiresAt) body.expiresAt = expiresAt;

            try {
                const response = await fetch('/api/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data || 'Something went wrong!');
                    return;
                }

                // show result
                const shortUrlEl = document.getElementById('shortUrl');
                shortUrlEl.href = data.shortUrl;
                shortUrlEl.textContent = data.shortUrl;
                document.getElementById('result').style.display = 'block';

            } catch (err) {
                showError('Failed to connect to server!');
            }
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function copyUrl() {
            const url = document.getElementById('shortUrl').textContent;
            navigator.clipboard.writeText(url);
            alert('Copied to clipboard!');
        }
    </script>
</body>

</html>
